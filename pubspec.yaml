name: studybuddy
description: AI-powered education companion for Sri Lankan O/L and A/L students.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  lottie: ^3.1.3
  path_provider: ^2.1.5
  rive: ^0.14.9
  supabase_flutter: ^2.8.3
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1
  qr_flutter: ^4.1.0
  share_plus: ^13.2.1
  flutter_markdown: ^0.7.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/animations/
    - assets/images/
